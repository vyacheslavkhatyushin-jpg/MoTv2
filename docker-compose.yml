services:
  mine-ops-tool:
    build:
      context: .
      dockerfile: server/Dockerfile
      # Прокси НА ЭТАПЕ СБОРКИ (apt-get, npm install) — отдельно от
      # HTTPS_PROXY/HTTP_PROXY в environment: ниже (тот только для
      # запущенного контейнера, сборки вообще не касается). Без этого
      # апдейт зависимостей в package.json за корпоративным прокси может
      # растягиваться на много минут вместо секунд/десятков секунд — npm
      # не падает сразу, а долго ретраит сетевые запросы. См.
      # docs/backup-setup.md, диагностика "долгая пересборка".
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      # Фолбэк-прокси, если сервер сидит за корпоративным (без него исходящие
      # запросы к Google при подключении Google Drive падают с "fetch
      # failed" — Docker НЕ прокидывает переменные окружения хоста внутрь
      # контейнера сам по себе). Основной способ задать прокси — Настройки →
      # Сеть в самом приложении (там же приоритет над этими переменными и
      # применяется без пересборки контейнера) — эти строки нужны только
      # как значение по умолчанию до первой настройки через UI, или если
      # прокси на разных площадках одинаковый и его проще один раз прописать
      # в .env. Пусто — ничего не меняется. См. docs/backup-setup.md.
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      - mine-ops-data:/app/server/data
    # Автобэкап (Настройки → Резервное копирование, см. docs/backup-setup.md)
    # не требует ничего в этом файле, кроме прокси выше — расписание,
    # SSH-ключ и Google Drive OAuth-токен настраиваются целиком через UI и
    # хранятся в БД (backup_settings, тот же volume выше). "Сделать бэкап
    # сейчас" запускается прямо отсюда (server/routes/backup.js —
    # db.backup() безопасен параллельно с живыми запросами).

  # Мониторинг оборудования (docs/monitoring-plan.md), Этап 2 — отдельный
  # процесс, тот же образ и та же SQLite-база (общий volume), но не часть
  # основного сервера: сетевые таймауты опроса не должны влиять на редактор.
  ping-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      # См. комментарий у mine-ops-tool выше — то же самое, для сборки.
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    command: ["node", "monitor/ping-worker.js"]
    restart: unless-stopped
    environment:
      - PING_INTERVAL_MS=60000
      - PING_CONCURRENCY=20
    volumes:
      - mine-ops-data:/app/server/data

  # Универсальный коллектор для настраиваемых источников (project_data_sources,
  # см. /parsing и server/routes/parsing.js) — читает parser_json из БД, а не
  # захардкоженный протокол на источник. Пока эта таблица пуста (никто не
  # "опубликовал" источник через /parsing), сервис просто ничего не делает —
  # включение нового источника не требует передеплоя, только запись в БД
  # через API.
  custom-monitor-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      # См. комментарий у mine-ops-tool выше — то же самое, для сборки.
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    command: ["node", "monitor/custom-monitor-worker.js"]
    restart: unless-stopped
    volumes:
      - mine-ops-data:/app/server/data

  # Плановый автобэкап (см. server/backup-worker.js) — отдельный процесс по
  # той же причине, что ping-worker: загрузка на офсайт-цель может подвиснуть,
  # это не должно задевать редактор. Расписание (время суток) настраивается
  # в БД через Настройки → Резервное копирование, не через env.
  backup-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      # См. комментарий у mine-ops-tool выше — то же самое, для сборки.
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    command: ["node", "backup-worker.js"]
    restart: unless-stopped
    environment:
      # См. комментарий у mine-ops-tool выше — то же самое.
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      - mine-ops-data:/app/server/data

volumes:
  mine-ops-data:
