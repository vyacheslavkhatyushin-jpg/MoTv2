services:
  mine-ops-tool:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      # Автобэкап (Настройки → Резервное копирование, см. docs/backup-setup.md):
      # "Сделать бэкап сейчас" запускается прямо отсюда (server/routes/backup.js —
      # db.backup() безопасен параллельно с живыми запросами), поэтому эти же
      # переменные нужны и здесь, не только у backup-worker ниже. SSH-ключ —
      # файловый секрет (смонтирован ниже, volumes); Google Drive — OAuth
      # refresh-token от личного аккаунта (не сервисный аккаунт: у тех нет
      # своей квоты хранилища для обычной папки на личном Диске), сам токен —
      # обычная переменная окружения, не файл, получается один раз через
      # server/backup/gdrive-device-auth.js — см. docs/backup-setup.md.
      - BACKUP_SSH_HOST=${BACKUP_SSH_HOST:-}
      - BACKUP_SSH_USER=${BACKUP_SSH_USER:-}
      - BACKUP_SSH_PORT=${BACKUP_SSH_PORT:-22}
      - BACKUP_SSH_KEY_PATH=/run/secrets/backup_ssh_key
      - BACKUP_SSH_REMOTE_DIR=${BACKUP_SSH_REMOTE_DIR:-}
      - BACKUP_GDRIVE_CLIENT_ID=${BACKUP_GDRIVE_CLIENT_ID:-}
      - BACKUP_GDRIVE_CLIENT_SECRET=${BACKUP_GDRIVE_CLIENT_SECRET:-}
      - BACKUP_GDRIVE_REFRESH_TOKEN=${BACKUP_GDRIVE_REFRESH_TOKEN:-}
      - BACKUP_GDRIVE_FOLDER_ID=${BACKUP_GDRIVE_FOLDER_ID:-}
    volumes:
      - mine-ops-data:/app/server/data
      # Раскомментируйте после того, как реально положите файл по этому пути
      # на хосте (см. docs/backup-setup.md) — bind-mount несуществующего
      # файла Docker молча подменяет ПУСТОЙ ПАПКОЙ, а не ошибкой, и бэкап
      # будет фейлиться с непонятной ошибкой чтения ключа.
      # - ./secrets/backup_ssh_key:/run/secrets/backup_ssh_key:ro

  # Мониторинг оборудования (docs/monitoring-plan.md), Этап 2 — отдельный
  # процесс, тот же образ и та же SQLite-база (общий volume), но не часть
  # основного сервера: сетевые таймауты опроса не должны влиять на редактор.
  ping-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "monitor/ping-worker.js"]
    restart: unless-stopped
    environment:
      - PING_INTERVAL_MS=60000
      - PING_CONCURRENCY=20
    volumes:
      - mine-ops-data:/app/server/data

  # Универсальный коллектор для настраиваемых источников (project_data_sources,
  # см. /parsing и server/routes/parsing.js) — читает parser_json из БД, а не
  # захардкоженный протокол на источник. Пока эта таблица пуста (никто не
  # "опубликовал" источник через /parsing), сервис просто ничего не делает —
  # включение нового источника не требует передеплоя, только запись в БД
  # через API.
  custom-monitor-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "monitor/custom-monitor-worker.js"]
    restart: unless-stopped
    volumes:
      - mine-ops-data:/app/server/data

  # Плановый автобэкап (см. server/backup-worker.js) — отдельный процесс по
  # той же причине, что ping-worker: загрузка на офсайт-цель может подвиснуть,
  # это не должно задевать редактор. Расписание (время суток) настраивается
  # в БД через Настройки → Резервное копирование, не через env.
  backup-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "backup-worker.js"]
    restart: unless-stopped
    environment:
      - BACKUP_SSH_HOST=${BACKUP_SSH_HOST:-}
      - BACKUP_SSH_USER=${BACKUP_SSH_USER:-}
      - BACKUP_SSH_PORT=${BACKUP_SSH_PORT:-22}
      - BACKUP_SSH_KEY_PATH=/run/secrets/backup_ssh_key
      - BACKUP_SSH_REMOTE_DIR=${BACKUP_SSH_REMOTE_DIR:-}
      - BACKUP_GDRIVE_CLIENT_ID=${BACKUP_GDRIVE_CLIENT_ID:-}
      - BACKUP_GDRIVE_CLIENT_SECRET=${BACKUP_GDRIVE_CLIENT_SECRET:-}
      - BACKUP_GDRIVE_REFRESH_TOKEN=${BACKUP_GDRIVE_REFRESH_TOKEN:-}
      - BACKUP_GDRIVE_FOLDER_ID=${BACKUP_GDRIVE_FOLDER_ID:-}
    volumes:
      - mine-ops-data:/app/server/data
      # См. комментарий у mine-ops-tool выше — то же самое, оба сервиса
      # должны видеть один и тот же файл SSH-ключа (Google Drive — просто
      # переменные окружения, файла тут больше нет).
      # - ./secrets/backup_ssh_key:/run/secrets/backup_ssh_key:ro

volumes:
  mine-ops-data:
